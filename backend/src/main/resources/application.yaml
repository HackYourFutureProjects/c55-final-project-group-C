spring:
  application:
    name: hyf-project-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_db}?currentSchema=${DB_SCHEMA:app}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  flyway:
    schemas: ${DB_SCHEMA:app}
    # Email notification configuration for password reset
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
  error:
    # Belt and braces next to GlobalExceptionHandler: devtools turns both of these on in
    # development, so without pinning them a stack trace goes out in dev and the message
    # is dropped in production - the same error reading differently per environment.
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:jobmatch.team2026@gmail.com}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:${app.base-url}/api/login/oauth2/code/google}
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:${app.base-url}/}
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:${app.base-url}/login?error=oauth}
    link-required-redirect: ${OAUTH2_LINK_REDIRECT:${app.base-url}/login?error=google_link_required}
    # Google never shows our terms, so a first sign-in through it lands here instead of home.
    terms-required-redirect: ${OAUTH2_TERMS_REDIRECT:${app.base-url}/accept-terms}


  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${LLM_MODEL:gemini-flash-lite-latest}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
    # Sent as reasoning_effort. Set for a model that thinks by default (Gemini 3 flash costs
    # ~14s without it, ~4s with "low"). Leave empty for a provider that rejects the field.
    reasoning-effort: ${LLM_REASONING_EFFORT:low}

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi.yaml
scalar:
  enabled: true
  path: /api/docs
  url: ${springdoc.api-docs.path}
