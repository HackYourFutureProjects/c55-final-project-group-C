version: 2

models:
  - name: int_postings_skills
    description: >
      One row per posting and skill, skills lowercased and trimmed. Postings with
      no skills do not appear here at all. Not published to the backend: it
      exists so fct_postings and fct_skill_popularity agree on what a skill is.
    # Neither column is unique on its own, so the grain is checked by
    # tests/assert_one_row_per_posting_tag.sql rather than by a `unique` test
    # here. dbt_utils has a test for column pairs; this project installs no
    # packages, and one small SQL file is a fair trade for that.
    columns:
      - name: posting_id
        description: The posting this skill belongs to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_postings')
                field: posting_id
      - name: skill
        description: One skill, lowercased and trimmed.
        tests: [not_null]
      - name: posted_at
        description: Carried from the posting, so this model can be filtered by date on its own.
        tests: [not_null]